name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookmark_user
          POSTGRES_PASSWORD: bookmark_pass
          POSTGRES_DB: bookmark_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookmark_user -d bookmark_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://bookmark_user:bookmark_pass@localhost:5432/bookmark_manager?schema=public"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Apply migrations
        run: bunx prisma migrate deploy

      - name: Run tests
        run: bun run test