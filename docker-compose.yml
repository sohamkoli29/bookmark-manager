services:
  postgres:
    image: postgres:16
    container_name: bookmark-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookmark_user
      POSTGRES_PASSWORD: bookmark_pass
      POSTGRES_DB: bookmark_manager
    ports:
      - "5432:5432"
    volumes:
      - bookmark_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmark_user -d bookmark_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: bookmark-manager-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://bookmark_user:bookmark_pass@postgres:5432/bookmark_manager?schema=public"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  bookmark_pg_data: